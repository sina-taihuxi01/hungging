<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>古诗欣赏 · 静夜思</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            margin: 0;
            font-family: "KaiTi", "STKaiti", "SimSun", serif;
            background-color: #f7f4ef;
            color: #2c2c2c;
        }

        header {
            background: linear-gradient(120deg, #7a1f1f, #a83232);
            color: #fff;
            text-align: center;
            padding: 40px 20px;
        }

        header h1 {
            margin: 0;
            font-size: 36px;
            letter-spacing: 6px;
        }

        header p {
            margin-top: 10px;
            font-size: 18px;
            opacity: 0.9;
        }

        .container {
            max-width: 800px;
            margin: 50px auto;
            padding: 40px;
            background: #fffdf8;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
        }

        .poem-title {
            text-align: center;
            font-size: 30px;
            margin-bottom: 10px;
        }

        .poem-author {
            text-align: center;
            font-size: 18px;
            color: #777;
            margin-bottom: 40px;
        }

        .poem-content {
            text-align: center;
            font-size: 22px;
            line-height: 2.2;
            letter-spacing: 4px;
        }

        .analysis {
            margin-top: 50px;
            padding-top: 30px;
            border-top: 1px dashed #ccc;
        }

        .analysis h2 {
            font-size: 22px;
            margin-bottom: 15px;
            color: #7a1f1f;
        }

        .analysis p {
            font-size: 18px;
            line-height: 1.9;
            text-indent: 2em;
        }

        footer {
            text-align: center;
            padding: 20px;
            color: #666;
            font-size: 14px;
        }
    </style>
</head>
<body>

<header>
    <h1>古诗欣赏</h1>
    <p>诗以言志 · 文以载道</p>
</header>

<div class="container">
    <div class="poem-title">静夜思</div>
    <div class="poem-author">唐 · 李白</div>

    <div class="poem-content">
        床前明月光，<br>
        疑是地上霜。<br>
        举头望明月，<br>
        低头思故乡。
    </div>

    <div class="analysis">
        <h2>诗词赏析</h2>
        <p>
            《静夜思》是唐代诗人李白的代表作之一。
            诗中通过月光与霜的比喻，描绘了夜深人静时诗人内心的孤独与思乡之情。
            语言朴素自然，却情感真挚，千百年来引起无数读者的共鸣。
        </p>
    </div>
</div>
